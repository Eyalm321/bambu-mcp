[project]
name = "bambu-mcp"
version = "0.1.0"
description = "MCP server to drive a Bambu Lab P2S (LAN mode): slice-free print control, status, temps, files."
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "bambulabs-api>=2.5.0",
]

[project.scripts]
bambu-mcp = "bambu_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bambu_mcp"]
